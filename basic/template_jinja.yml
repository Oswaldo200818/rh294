---
- name: Desplegar app.conf con lógica condicional 
  hosts: webservers
  become: yes

  vars:
    enable_debugging: false 

  tasks: 
    - name: Generar el archivo app.conf desde la plantilla 
      ansible.builtin.template: 
        src: templates/app.conf.j2
        dest: /etc/app.conf 
        owner: root 
        group: root 
        mode: '0644'

