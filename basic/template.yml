---
- name: Desplegar configuración de NTP 
  hosts: webservers
  vars: 
    - 0.pool.ntp.org
    - 1.pool.ntp.org
    - 2.pool.ntp.org 

  tasks:
    - name: Generar chrony.conf desde la plantilla
      ansible.builtin.template:
        src: templates/chrony.conf.j2
        dest: /etc/chrony.conf
        owner: root
        group: root
        mode: '0644'
      notify: restart chrony.d 
  
  handlers:
    - name: restart chrony.d 
      ansible.builtin.service:
        name: chronyd 
        state: restarted 
        